name: Spec check

# Weekly check for newly published Firefly III API specs that are not yet vendored in api/.
# When upstream has specs we don't have, it opens (or comments on) an issue labeled
# 'spec-check'; once every published spec is vendored again it closes the issue.
#
# The checker is scripts/check-spec-version.cs, a .NET 10 file-based app.
# Exit codes: 0 = up to date, 1 = new upstream specs, 2 = could not complete (fails this job,
# does not touch the issue).
#
# Runs WITHOUT --diff on purpose: the SDK deliberately pins its API version, so the path diff
# against the newest upstream spec would always report drift. Run the script locally with
# `dotnet run scripts/check-spec-version.cs -- --diff` to size that gap when planning a bump.

on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10 (file-based apps)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Check for new upstream specs
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}   # the checker scans every upstream branch; avoids anonymous API rate limits
        run: |
          set +e
          dotnet run scripts/check-spec-version.cs | tee spec-check.log
          code=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # 2 = network/parse failure: fail loudly so the run shows red instead of silently passing.
          if [ "$code" -eq 2 ]; then exit 2; fi

      - name: Open, update, or close spec-check issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label spec-check --state open \
            --json number --jq '.[0].number // empty' || true)

          if [ "${{ steps.check.outputs.exit_code }}" = "1" ]; then
            {
              echo "Upstream has published Firefly III API specs that are not vendored in \`api/\` (checked $(date -u +%F))."
              echo
              echo '```'
              cat spec-check.log
              echo '```'
              echo
              echo "To vendor them:"
              echo "1. Download each file listed above (the raw URLs are in the report) into \`api/\`, keeping the upstream file name (keep the old files — api/ is the version history)"
              echo "2. The SDK keeps pinning its spec; run \`dotnet run scripts/check-spec-version.cs -- --diff\` to size the gap before deciding on a bump (see README.md)"
            } > issue-body.md

            if [ -n "$existing" ]; then
              gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body-file issue-body.md
            else
              gh label create spec-check --repo "$GITHUB_REPOSITORY" \
                --description "New upstream Firefly III API specs to vendor" \
                --color D93F0B 2>/dev/null || true
              gh issue create --repo "$GITHUB_REPOSITORY" \
                --title "New upstream Firefly III API specs available" \
                --label spec-check --body-file issue-body.md
            fi
          elif [ -n "$existing" ]; then
            gh issue close "$existing" --repo "$GITHUB_REPOSITORY" \
              --comment "Every published upstream spec is vendored again — closing."
          fi
